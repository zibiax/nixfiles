# https://nikitabobko.github.io/AeroSpace/guide#config-samples

config-version = 2

start-at-login = true
automatically-unhide-macos-hidden-apps = true
enable-normalization-flatten-containers = true
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
persistent-workspaces = ['GHOSTTY', 'HELIUM', 'FINDER', 'VESKTOP', 'SIGNAL', 'MAIL', 'PROTON-PASS', 'SIOYEK', 'MUSIC', 'TORRENT', 'AGENTHARNESS']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 40
outer.right = 0

[mode.main.binding]
# Layout and recovery
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout tiles horizontal horizontal'
alt-space = 'layout floating tiling'
alt-backtick = 'flatten-workspace-tree'
alt-equal = 'balance-sizes'
alt-semicolon = 'mode service'
alt-f = 'fullscreen'

# Agent harness
alt-ctrl-shift-h = 'workspace AGENTHARNESS'

# Vim-like focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Vim-like window moves
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Quick side-by-side / stacking using join-with
alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'

# Vim-like resizing
alt-cmd-h = 'resize width -60'
alt-cmd-j = 'resize height +60'
alt-cmd-k = 'resize height -60'
alt-cmd-l = 'resize width +60'

# Workspace navigation: alt-ctrl + number goes to named workspaces
# (plain alt-number is reserved by macOS on the Swedish layout for
# Option-layer symbols like @ { [ ] }, so we avoid it here)
alt-ctrl-1 = 'workspace GHOSTTY'
alt-ctrl-2 = 'workspace HELIUM'
alt-ctrl-3 = 'workspace FINDER'
alt-ctrl-4 = 'workspace VESKTOP'
alt-ctrl-5 = 'workspace SIGNAL'
alt-ctrl-6 = 'workspace MAIL'
alt-ctrl-7 = 'workspace PROTON-PASS'
alt-ctrl-8 = 'workspace SIOYEK'
alt-ctrl-9 = 'workspace MUSIC'
alt-ctrl-0 = 'workspace TORRENT'
alt-tab = 'workspace-back-and-forth'

# Send window to workspace: alt-ctrl-shift + number
alt-ctrl-shift-1 = 'move-node-to-workspace GHOSTTY'
alt-ctrl-shift-2 = 'move-node-to-workspace HELIUM'
alt-ctrl-shift-3 = 'move-node-to-workspace FINDER'
alt-ctrl-shift-4 = 'move-node-to-workspace VESKTOP'
alt-ctrl-shift-5 = 'move-node-to-workspace SIGNAL'
alt-ctrl-shift-6 = 'move-node-to-workspace MAIL'
alt-ctrl-shift-7 = 'move-node-to-workspace PROTON-PASS'
alt-ctrl-shift-8 = 'move-node-to-workspace SIOYEK'
alt-ctrl-shift-9 = 'move-node-to-workspace MUSIC'
alt-ctrl-shift-0 = 'move-node-to-workspace TORRENT'

# Monitor flow
alt-left = 'focus-monitor --wrap-around left'
alt-right = 'focus-monitor --wrap-around right'
alt-shift-left = 'move-node-to-monitor --focus-follows-window --wrap-around left'
alt-shift-right = 'move-node-to-monitor --focus-follows-window --wrap-around right'
alt-shift-m = 'move-workspace-to-monitor --wrap-around next'
alt-shift-y = 'move-node-to-workspace RAYCASTAI'

# App launchers: letters are always "open/focus app on its home workspace"
# Workspace map:
# 1 GHOSTTY, 2 HELIUM, 3 FINDER, 4 VESKTOP, 5 SIGNAL, 6 MAIL, 7 PROTON-PASS, 8 SIOYEK, 9 MUSIC, 0 TORRENT, h AGENTHARNESS
alt-a = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh GHOSTTY com.mitchellh.ghostty"'
# alt-b = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair OBSIDIAN md.obsidian"'
alt-w = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh HELIUM net.imput.helium"'
alt-d = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair VESKTOP dev.vencord.vesktop"'
alt-g = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair SIGNAL org.whispersystems.signal-desktop"'
#alt-f = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair FIGMA com.figma.Desktop"'
#alt-o = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair DAVINCI com.obsproject.obs-studio"'
#alt-v = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair DAVINCI com.blackmagic-design.DaVinciResolveLite"'
alt-e = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair FINDER com.apple.finder"'
alt-p = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair PROTON-PASS me.proton.pass.electron"'
alt-n = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair ANKI net.ankiweb.launcher"'
alt-r = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair SIOYEK info.sioyek.sioyek"'
alt-s = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/music-home.sh"'
alt-y = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/raycast-ai.sh"'
alt-m = 'exec-and-forget /bin/bash -lc "$HOME/.config/scripts/aerospace-home.sh --repair MAIL com.apple.mail"'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
b = ['balance-sizes', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
h = ['focus-monitor --wrap-around left', 'mode main']
l = ['focus-monitor --wrap-around right', 'mode main']
shift-h = ['move-node-to-monitor --focus-follows-window --wrap-around left', 'mode main']
shift-l = ['move-node-to-monitor --focus-follows-window --wrap-around right', 'mode main']
m = ['move-workspace-to-monitor --wrap-around next', 'mode main']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace GHOSTTY'

[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = 'move-node-to-workspace HELIUM'

[[on-window-detected]]
if.app-id = 'dev.vencord.vesktop'
run = 'move-node-to-workspace VESKTOP'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace MAIL'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace MUSIC'

[[on-window-detected]]
if.app-id = 'me.proton.pass.electron'
run = 'move-node-to-workspace PROTON-PASS'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace FINDER'

[[on-window-detected]]
if.app-id = 'net.ankiweb.launcher'
run = 'move-node-to-workspace ANKI'

[[on-window-detected]]
if.app-id = 'info.sioyek.sioyek'
run = 'move-node-to-workspace SIOYEK'

[[on-window-detected]]
if.app-id = 'com.t3tools.t3code'
run = 'move-node-to-workspace AGENTHARNESS'

[[on-window-detected]]
if.app-id = 'org.qbittorrent.qBittorrent'
run = 'move-node-to-workspace TORRENT'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
if.window-title-regex-substring = 'AI Chat'
run = 'move-node-to-workspace RAYCASTAI'
